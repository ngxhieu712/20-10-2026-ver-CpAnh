<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff7f4" />
    <meta name="description" content="Một lời chúc dịu dàng gửi đến những người phụ nữ tuyệt vời nhân ngày 20/10." />
    <title>Chúc mừng ngày Phụ nữ Việt Nam 20/10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="petal-field" aria-hidden="true"></div>

    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Trang chủ">
          <span class="brand-mark" aria-hidden="true">✿</span>
          <span>Gửi đến chị Phanh</span>
        </a>
        <span class="top-note">Nhân ngày Phụ nữ Việt Nam 20/10</span>
      </header>

      <section class="hero" id="home" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow"><span class="eyebrow-line"></span> 20 tháng 10 <span class="eyebrow-line"></span></p>
          <h1 id="hero-title">Chúc mừng<br /><em>ngày của chị</em></h1>
          <p class="intro"></p>

          <div class="hero-actions">
            <button class="wish-button" id="wish-button" type="button">
              <span>Lời chúc của em Híu</span>
              <span class="button-icon" aria-hidden="true">✦</span>
            </button>
            <span class="little-note"><span aria-hidden="true">♡</span> Gửi tới chị Phưn Anh</span>
          </div>
        </div>

        <div class="art-wrap" aria-label="Minh họa bó hoa màu hồng">
          <div class="sun-disc" aria-hidden="true"></div>
          <div class="art-spark spark-a" aria-hidden="true">✦</div>
          <div class="art-spark spark-b" aria-hidden="true">✧</div>
          <div class="flower flower-one" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
          <div class="flower flower-two" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
          <div class="flower flower-three" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><b></b></div>
          <div class="leaf leaf-one" aria-hidden="true"></div>
          <div class="leaf leaf-two" aria-hidden="true"></div>
          <div class="leaf leaf-three" aria-hidden="true"></div>
          <div class="leaf leaf-four" aria-hidden="true"></div>
          <div class="stem stem-one" aria-hidden="true"></div>
          <div class="stem stem-two" aria-hidden="true"></div>
          <div class="stem stem-three" aria-hidden="true"></div>
        </div>
      </section>

      <section class="album" id="album" aria-labelledby="album-title">
        <p class="album-kicker"><span></span> 20/10 Mini Album <span></span></p>
        <h2 id="album-title">Những khoảnh khắc <em> cute </em></h2>
        <p class="album-intro"></p>
        <div class="photo-grid" aria-label="Album ảnh những khoảnh khắc">
          <figure class="photo-card">
            <img src="assets/Screenshot%202026-10-20%20211638.png" alt="Khoảnh khắc trong album" loading="lazy" />
          </figure>
          <figure class="photo-card">
            <img src="assets/Screenshot%202026-10-20%20211647.png" alt="Khoảnh khắc trong album" loading="lazy" />
          </figure>
          <figure class="photo-card">
            <img src="assets/Screenshot%202026-10-20%20211700.png" alt="Khoảnh khắc trong album" loading="lazy" />
          </figure>
          <figure class="photo-card">
            <img src="assets/Screenshot%202026-10-20%20211718.png" alt="Khoảnh khắc trong album" loading="lazy" />
          </figure>
          <figure class="photo-card">
            <img src="assets/Screenshot%202026-10-20%20211740.png" alt="Khoảnh khắc trong album" loading="lazy" />
          </figure>
          <figure class="photo-card">
            <img src="assets/Screenshot%202026-10-20%20211750.png" alt="Khoảnh khắc trong album" loading="lazy" />
          </figure>
        </div>
      </section>

      <footer class="footer">
        <span class="footer-flower" aria-hidden="true">✿</span>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <span class="toast-icon" aria-hidden="true">♡</span>
      <p id="toast-message">Chúc chị luôn vui vẻ, bình an và được yêu thương thật nhiều!</p>
      <button class="toast-close" id="toast-close" type="button" aria-label="Đóng lời chúc">×</button>
    </div>
  </body>
</html>
